<!doctype html>
<html lang="vi">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APP_DOMAIN Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;

  <div class="card">
    <h1>APP_DOMAIN reached successfully</h1>
